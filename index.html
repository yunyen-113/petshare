<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🐾 萌寵交流園地 PetShare 🐾</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Comic Sans MS", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #ffe0ec 0%, #fff5d6 50%, #d6f5ff 100%);
    min-height: 100vh;
    color: #5a4a6a;
  }

  /* ====== Top Navigation ====== */
  .navbar {
    background: linear-gradient(90deg, #ff9ec7, #ffc785, #a8e6cf);
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 16px rgba(255, 158, 199, 0.3);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
  }

  .logo {
    font-size: 26px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 0 #ff7eb3, 4px 4px 8px rgba(0,0,0,0.1);
    cursor: pointer;
    user-select: none;
  }

  .nav-links {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .nav-btn {
    background: #fff;
    color: #ff7eb3;
    border: 3px solid #fff;
    padding: 8px 18px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    transition: all 0.25s;
    font-family: inherit;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  }

  .nav-btn:hover {
    transform: translateY(-2px) scale(1.05);
    background: #fff5d6;
    color: #e85d97;
  }

  .nav-btn.primary {
    background: #ff7eb3;
    color: #fff;
  }

  .nav-btn.primary:hover {
    background: #e85d97;
    color: #fff;
  }

  .user-display {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    padding: 4px 14px 4px 4px;
    border-radius: 50px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  }

  .user-display img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #ffc785;
  }

  .user-display span {
    font-weight: bold;
    color: #ff7eb3;
  }

  /* ====== Pages ====== */
  .page {
    display: none;
    max-width: 800px;
    margin: 30px auto;
    padding: 0 16px;
    animation: fadeIn 0.4s ease;
  }

  .page.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ====== Cards ====== */
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 8px 24px rgba(255, 158, 199, 0.2);
    margin-bottom: 20px;
    border: 3px dashed #ffd6e8;
  }

  .card h2 {
    color: #ff7eb3;
    margin-bottom: 18px;
    font-size: 24px;
    text-align: center;
  }

  .card h2 .emoji {
    font-size: 28px;
  }

  /* ====== Forms ====== */
  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    color: #8a6b8a;
    font-weight: bold;
    font-size: 14px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #ffd6e8;
    border-radius: 16px;
    font-size: 15px;
    font-family: inherit;
    background: #fff9fc;
    color: #5a4a6a;
    transition: all 0.2s;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #ff9ec7;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 158, 199, 0.2);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  .form-group input[type="file"] {
    padding: 8px;
    background: #fff5f9;
    cursor: pointer;
  }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff9ec7, #ff7eb3);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
    box-shadow: 0 4px 12px rgba(255, 126, 179, 0.4);
    margin-top: 8px;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(255, 126, 179, 0.5);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn-secondary {
    background: linear-gradient(135deg, #a8e6cf, #7fd1ae);
    box-shadow: 0 4px 12px rgba(127, 209, 174, 0.4);
  }

  .btn-secondary:hover {
    box-shadow: 0 6px 18px rgba(127, 209, 174, 0.5);
  }

  .switch-link {
    text-align: center;
    margin-top: 16px;
    color: #8a6b8a;
    font-size: 14px;
  }

  .switch-link a {
    color: #ff7eb3;
    cursor: pointer;
    font-weight: bold;
    text-decoration: underline;
  }

  /* ====== Avatar Preview ====== */
  .avatar-preview {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #ffe0ec, #fff5d6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    overflow: hidden;
    border: 4px solid #ffc785;
    box-shadow: 0 4px 12px rgba(255, 199, 133, 0.4);
  }

  .avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ====== Profile Header ====== */
  .profile-header {
    background: linear-gradient(135deg, #ffe0ec, #fff5d6, #d6f5ff);
    border-radius: 24px;
    padding: 30px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(255, 158, 199, 0.2);
    border: 3px solid #fff;
  }

  .profile-header .avatar-preview {
    margin: 0 auto 14px;
    width: 120px;
    height: 120px;
    font-size: 50px;
  }

  .profile-header h1 {
    color: #ff7eb3;
    font-size: 26px;
    margin-bottom: 4px;
  }

  .profile-header p {
    color: #8a6b8a;
    font-size: 14px;
  }

  .profile-badge {
    display: inline-block;
    background: rgba(255,255,255,0.7);
    color: #ff7eb3;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: bold;
    margin-top: 8px;
  }

  .profile-stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 14px;
  }

  .profile-stat {
    background: rgba(255,255,255,0.6);
    padding: 8px 18px;
    border-radius: 16px;
    text-align: center;
  }

  .profile-stat .num {
    font-size: 22px;
    font-weight: bold;
    color: #ff7eb3;
    display: block;
  }

  .profile-stat .lbl {
    font-size: 12px;
    color: #8a6b8a;
  }

  .clickable-user {
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .clickable-user:hover {
    opacity: 0.75;
  }

  .back-btn {
    background: white;
    color: #ff7eb3;
    border: 2px solid #ffd6e8;
    padding: 8px 16px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 12px;
    transition: all 0.2s;
  }

  .back-btn:hover {
    background: #fff5f9;
    transform: translateX(-3px);
  }

  .new-post-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #ffc785, #ffb366);
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin: 16px 0;
    transition: all 0.25s;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(255, 179, 102, 0.4);
  }

  .new-post-btn:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 8px 20px rgba(255, 179, 102, 0.5);
  }

  /* ====== Posts ====== */
  .section-title {
    font-size: 22px;
    color: #ff7eb3;
    margin: 24px 0 14px;
    text-align: center;
    font-weight: bold;
  }

  .post {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 6px 18px rgba(255, 158, 199, 0.15);
    border: 2px solid #fff5f9;
    transition: transform 0.2s;
  }

  .post:hover {
    transform: translateY(-2px);
  }

  .post-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .post-header img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ffd6e8;
  }

  .post-header .user-info {
    flex: 1;
  }

  .post-header .user-id {
    font-weight: bold;
    color: #ff7eb3;
    font-size: 15px;
  }

  .post-header .post-time {
    font-size: 12px;
    color: #b5a5b5;
  }

  .post-delete-btn {
    background: #fff5f9;
    color: #e85d97;
    border: 2px solid #ffd6e8;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
    flex-shrink: 0;
  }

  .post-delete-btn:hover {
    background: #ffd6e8;
    transform: scale(1.1) rotate(8deg);
    color: #c94545;
  }

  .post-title {
    font-size: 20px;
    font-weight: bold;
    color: #5a4a6a;
    margin-bottom: 8px;
  }

  .post-content {
    color: #6a5a7a;
    line-height: 1.6;
    margin-bottom: 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .post-image {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 12px;
  }

  .post-actions {
    display: flex;
    gap: 14px;
    padding-top: 12px;
    border-top: 2px dashed #ffe0ec;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff5f9;
    border: 2px solid #ffd6e8;
    padding: 6px 14px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 14px;
    color: #8a6b8a;
    font-family: inherit;
    transition: all 0.2s;
    font-weight: bold;
  }

  .action-btn:hover {
    background: #ffe0ec;
    transform: scale(1.05);
  }

  .action-btn.liked {
    background: #ffd6e8;
    color: #e85d97;
    border-color: #ff9ec7;
  }

  /* ====== Comments ====== */
  .comments-section {
    margin-top: 12px;
    padding: 14px;
    background: #fff9fc;
    border-radius: 14px;
    display: none;
  }

  .comments-section.active {
    display: block;
  }

  .comment {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: white;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid #ffe0ec;
  }

  .comment img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #ffd6e8;
    flex-shrink: 0;
  }

  .comment-body {
    flex: 1;
  }

  .comment-user {
    font-weight: bold;
    color: #ff7eb3;
    font-size: 13px;
  }

  .comment-text {
    color: #6a5a7a;
    font-size: 14px;
    word-wrap: break-word;
    margin-top: 2px;
  }

  .comment-input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .comment-input-row input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #ffd6e8;
    border-radius: 50px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }

  .comment-input-row input:focus {
    outline: none;
    border-color: #ff9ec7;
  }

  .comment-input-row button {
    padding: 8px 18px;
    background: #ff9ec7;
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
    font-size: 14px;
  }

  .comment-input-row button:hover {
    background: #ff7eb3;
  }

  .no-comments {
    text-align: center;
    color: #b5a5b5;
    font-size: 13px;
    padding: 8px;
  }

  /* ====== Empty State ====== */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #b5a5b5;
  }

  .empty-state .emoji {
    font-size: 60px;
    display: block;
    margin-bottom: 12px;
  }

  /* ====== Modal ====== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(90, 74, 106, 0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.active {
    display: flex;
    animation: fadeIn 0.2s;
  }

  .modal {
    background: white;
    border-radius: 24px;
    padding: 30px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    border: 3px dashed #ffd6e8;
    animation: popIn 0.3s;
  }

  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal .emoji {
    font-size: 50px;
    display: block;
    margin-bottom: 12px;
  }

  .modal h3 {
    color: #ff7eb3;
    margin-bottom: 10px;
    font-size: 20px;
  }

  .modal p {
    color: #8a6b8a;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .modal-buttons {
    display: flex;
    gap: 10px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 50px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
  }

  .modal-buttons .btn-cancel {
    background: #f0e5f0;
    color: #8a6b8a;
  }

  .modal-buttons .btn-cancel:hover {
    background: #e0d5e0;
  }

  .modal-buttons .btn-confirm {
    background: linear-gradient(135deg, #ff9ec7, #ff7eb3);
    color: white;
  }

  /* ====== Toast Notification ====== */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #a8e6cf, #7fd1ae);
    color: white;
    padding: 12px 24px;
    border-radius: 50px;
    font-weight: bold;
    box-shadow: 0 6px 18px rgba(127, 209, 174, 0.4);
    z-index: 300;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    top: 90px;
  }

  /* ====== Image preview in posting ====== */
  .post-image-preview {
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    border-radius: 16px;
    margin-top: 10px;
    display: none;
  }

  .post-image-preview.show {
    display: block;
  }

  .post-user-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: linear-gradient(135deg, #fff5d6, #ffe0ec);
    border-radius: 16px;
    margin-bottom: 16px;
  }

  .post-user-banner img {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
  }

  .post-user-banner .id-text {
    font-weight: bold;
    color: #ff7eb3;
    font-size: 16px;
  }

  .post-user-banner .label-text {
    font-size: 12px;
    color: #8a6b8a;
  }

  /* ====== Footer paw decoration ====== */
  .paw-deco {
    text-align: center;
    padding: 24px 16px;
    font-size: 20px;
    color: #ffc785;
    letter-spacing: 8px;
  }

  /* ====== Captcha Modal ====== */
  .captcha-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(90, 74, 106, 0.6);
    z-index: 250;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .captcha-overlay.active {
    display: flex;
    animation: fadeIn 0.25s;
  }

  .captcha-modal {
    background: white;
    border-radius: 24px;
    padding: 24px;
    max-width: 460px;
    width: 100%;
    border: 3px dashed #ffd6e8;
    animation: popIn 0.3s;
  }

  .captcha-title {
    font-size: 20px;
    color: #5a4a6a;
    text-align: center;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .captcha-subtitle {
    text-align: center;
    color: #8a6b8a;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .captcha-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }

  .captcha-cell {
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    border: 3px solid transparent;
    transition: all 0.2s;
    background: #fff5f9;
  }

  .captcha-cell:hover {
    transform: scale(1.03);
  }

  .captcha-cell.selected {
    border-color: #ff7eb3;
    box-shadow: 0 0 0 4px rgba(255, 126, 179, 0.25);
  }

  .captcha-cell.selected::after {
    content: '✓';
    position: absolute;
    top: 6px;
    right: 6px;
    width: 26px;
    height: 26px;
    background: #ff7eb3;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .captcha-cell svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .captcha-actions {
    display: flex;
    gap: 10px;
  }

  .captcha-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 50px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    transition: all 0.2s;
  }

  .captcha-cancel {
    background: #f0e5f0;
    color: #8a6b8a;
  }

  .captcha-cancel:hover {
    background: #e0d5e0;
  }

  .captcha-verify {
    background: linear-gradient(135deg, #ffc785, #ff9966);
    color: white;
    box-shadow: 0 4px 12px rgba(255, 153, 102, 0.4);
  }

  .captcha-verify:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(255, 153, 102, 0.5);
  }

  .captcha-error {
    background: #ffe0e0;
    color: #c94545;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 12px;
    font-size: 14px;
    display: none;
  }

  .captcha-error.show { display: block; animation: shake 0.4s; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .navbar { padding: 10px 14px; }
    .logo { font-size: 20px; }
    .nav-btn { padding: 6px 12px; font-size: 13px; }
    .card { padding: 20px; }
    .profile-header { padding: 20px; }
  }
</style>
</head>
<body>

<!-- ====== Top Nav ====== -->
<nav class="navbar">
  <div class="logo" onclick="navigateTo('share')">🐾 PetShare 萌寵園地</div>
  <div class="nav-links" id="navLinks"></div>
</nav>

<!-- ====== Login Page ====== -->
<div class="page" id="page-login">
  <div class="card">
    <h2><span class="emoji">🐶</span> 歡迎回來！</h2>
    <div class="form-group">
      <label>ID 帳號</label>
      <input type="text" id="loginId" placeholder="請輸入你的 ID" />
    </div>
    <div class="form-group">
      <label>密碼</label>
      <input type="password" id="loginPassword" placeholder="請輸入密碼" />
    </div>
    <button class="btn" onclick="login()">🐾 登入</button>
    <div class="switch-link">
      還沒有帳號？ <a onclick="navigateTo('register')">立即註冊</a>
    </div>
  </div>
</div>

<!-- ====== Register Page ====== -->
<div class="page" id="page-register">
  <div class="card">
    <h2><span class="emoji">🐱</span> 加入萌寵大家庭！</h2>
    <div class="avatar-preview" id="registerAvatarPreview">🐾</div>
    <div class="form-group">
      <label>上傳頭貼</label>
      <input type="file" id="registerAvatar" accept="image/*" onchange="previewAvatar(event, 'registerAvatarPreview')" />
    </div>
    <div class="form-group">
      <label>ID 帳號（唯一）</label>
      <input type="text" id="registerId" placeholder="例如：cutie_dog" />

    <div class="form-group">
      <label>顯示名稱</label>

<div class="captcha-overlay" id="captchaOverlay">
  <div class="captcha-modal">

    <div class="captcha-subtitle">驗證一下你不是機器人喵～</div>
    <div class="captcha-error" id="captchaError">😿 答案不太對喔，再試一次！</div>

    <div class="captcha-actions">
      <button class="captcha-cancel" onclick="closeCaptcha()">取消</button>

<!-- ====== Toast ====== -->
<div class="toast" id="toast">✨ 操作成功！</div>

<div class="paw-deco">🐾 🐾 🐾 🐾 🐾</div>

<script>
  // ====== Storage ======
  const STORAGE_KEYS = {
    USERS: 'petshare_users',
    POSTS: 'petshare_posts',
    SESSION: 'petshare_session'
  };

  function getUsers() {
    return JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
  }
  function saveUsers(users) {
    localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
  }
  function getPosts() {
    return JSON.parse(localStorage.getItem(STORAGE_KEYS.POSTS) || '[]');
  }
  function savePosts(posts) {
    localStorage.setItem(STORAGE_KEYS.POSTS, JSON.stringify(posts));
  }
  function getSession() {
    const s = localStorage.getItem(STORAGE_KEYS.SESSION);
    return s ? JSON.parse(s) : null;
  }
  function setSession(userId) {
    if (userId) {
      localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify({ userId }));
    } else {
      localStorage.removeItem(STORAGE_KEYS.SESSION);
    }
  }

  function currentUser() {
    const s = getSession();
    if (!s) return null;
    return getUsers().find(u => u.id === s.userId) || null;
  }

  // ====== Navigation ======
  // viewingProfileId: which user's profile we are currently viewing (null = own)
  let viewingProfileId = null;
  // previousPage: remember where we came from when viewing someone's profile (for the back button)
  let previousPage = 'share';

  function navigateTo(pageName, opts) {
    opts = opts || {};
    const user = currentUser();

    // For newpost: must be logged in
    if (pageName === 'newpost' && !user) {
      pageName = 'login';
    }

    // For profile: handle own vs. other user
    if (pageName === 'profile') {
      if (opts.userId) {
        viewingProfileId = opts.userId;
      } else if (user) {
        viewingProfileId = user.id;
      } else {
        // not logged in & not specifying — go to login
        pageName = 'login';
      }
      if (opts.from) previousPage = opts.from;
    }

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page-' + pageName);
    if (target) target.classList.add('active');

    // Refresh page contents
    if (pageName === 'profile') renderProfile();
    if (pageName === 'share') renderShare();
    if (pageName === 'newpost') prepareNewPost();
    if (pageName === 'login') {
      document.getElementById('loginId').value = '';
      document.getElementById('loginPassword').value = '';
    }
    if (pageName === 'register') {
      document.getElementById('registerId').value = '';
      document.getElementById('registerName').value = '';
      document.getElementById('registerPassword').value = '';
      document.getElementById('registerAvatar').value = '';
      document.getElementById('registerAvatarPreview').innerHTML = '🐾';
    }

    renderNav();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Shortcut: view a specific user's profile (from anywhere)
  function viewUserProfile(userId) {
    const activeId = document.querySelector('.page.active')?.id?.replace('page-', '') || 'share';
    navigateTo('profile', { userId, from: activeId });
  }

  function goBackFromProfile() {
    navigateTo(previousPage || 'share');
  }

  // Always go to MY OWN profile (used by nav bar)
  function goToMyProfile() {
    const me = currentUser();
    if (!me) { navigateTo('login'); return; }
    navigateTo('profile', { userId: me.id });
  }

  function renderNav() {
    const nav = document.getElementById('navLinks');
    const user = currentUser();
    let html = `<button class="nav-btn" onclick="navigateTo('share')">🌈 分享區</button>`;
    if (user) {
      html += `<button class="nav-btn" onclick="goToMyProfile()">🏡 個人首頁</button>`;
      html += `<div class="user-display clickable-user" onclick="goToMyProfile()" title="前往我的個人首頁"><img src="${user.avatar}" alt=""/><span>${escapeHtml(user.name)}</span></div>`;
      html += `<button class="nav-btn" onclick="logout()">登出</button>`;
    } else {
      html += `<button class="nav-btn primary" onclick="navigateTo('login')">登入</button>`;
      html += `<button class="nav-btn" onclick="navigateTo('register')">註冊</button>`;
    }
    nav.innerHTML = html;
  }

  // ====== Avatar preview ======
  function previewAvatar(event, previewId) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById(previewId).innerHTML = `<img src="${e.target.result}" alt="avatar" />`;
    };
    reader.readAsDataURL(file);
  }

  function previewPostImage(event) {
    const file = event.target.files[0];
    const preview = document.getElementById('postImagePreview');
    if (!file) {
      preview.classList.remove('show');
      preview.src = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.classList.add('show');
    };
    reader.readAsDataURL(file);
  }

  // ====== Default avatar ======
  function defaultAvatar() {
    // simple SVG paw as default
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffe0ec'/><text x='50' y='62' font-size='50' text-anchor='middle'>🐾</text></svg>`;
    return 'data:image/svg+xml;utf8,' + svg;
  }

  // ====== Register ======
  function register() {
    const id = document.getElementById('registerId').value.trim();
    const name = document.getElementById('registerName').value.trim();
    const password = document.getElementById('registerPassword').value;
    const avatarFile = document.getElementById('registerAvatar').files[0];

    if (!id || !name || !password) {
      showModal('🐾', '欄位未填寫', '請填寫 ID、名稱與密碼喔～', [{ text: '好的', primary: true }]);
      return;
    }

    const users = getUsers();
    if (users.some(u => u.id === id)) {
      showModal('😿', 'ID 已被使用', '這個 ID 已被其他人使用，請換一個試試！', [{ text: '好的', primary: true }]);
      return;
    }

    // Trigger captcha before actually creating the account
    openCaptcha(() => {
      const finishRegister = (avatarData) => {
        const users2 = getUsers();
        if (users2.some(u => u.id === id)) {
          showModal('😿', 'ID 已被使用', '這個 ID 已被其他人使用，請換一個試試！', [{ text: '好的', primary: true }]);
          return;
        }
        users2.push({ id, name, password, avatar: avatarData });
        saveUsers(users2);
        showToast('🎉 註冊成功！請登入');
        navigateTo('login');
      };

      if (avatarFile) {
        const reader = new FileReader();
        reader.onload = (e) => finishRegister(e.target.result);
        reader.readAsDataURL(avatarFile);
      } else {
        finishRegister(defaultAvatar());
      }
    });
  }

  // ====== Captcha ======
  // 9 cells. Some are cats, some are not. Each render shuffles.
  // type: 'cat' must be selected; everything else must NOT be selected.
  const CAPTCHA_POOL = [
    // Cats (cute illustration SVGs)
    { type: 'cat',  svg: makeAnimalSvg('🐱', '#cfe8ff') },
    { type: 'cat',  svg: makeAnimalSvg('😺', '#ffe0ec') },
    { type: 'cat',  svg: makeAnimalSvg('🐈', '#fff5d6') },
    { type: 'cat',  svg: makeAnimalSvg('😸', '#ffd6c2') },
    { type: 'cat',  svg: makeAnimalSvg('🐈‍⬛', '#e8d6ff') },
    // Dogs / others (NOT cats)
    { type: 'dog',  svg: makeAnimalSvg('🐶', '#ffe5cc') },
    { type: 'dog',  svg: makeAnimalSvg('🐕', '#d6f5ff') },
    { type: 'dog',  svg: makeAnimalSvg('🐩', '#ffd6e8') },
    { type: 'dog',  svg: makeAnimalSvg('🦮', '#e0ffd6') },
    { type: 'other', svg: makeAnimalSvg('🐼', '#d6ffe5') },
    { type: 'other', svg: makeAnimalSvg('🐰', '#fff0d6') },
    { type: 'other', svg: makeAnimalSvg('🐹', '#ffe0d6') },
  ];

  let captchaState = {
    cells: [],
    selected: new Set(),
    onSuccess: null
  };

  function makeAnimalSvg(emoji, bg) {
    return `
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <defs>
          <radialGradient id='g${emoji.codePointAt(0)}' cx='50%' cy='40%' r='65%'>
            <stop offset='0%' stop-color='white' stop-opacity='0.5'/>
            <stop offset='100%' stop-color='${bg}'/>
          </radialGradient>
        </defs>
        <rect width='100' height='100' fill='${bg}'/>
        <circle cx='50' cy='40' r='42' fill='url(#g${emoji.codePointAt(0)})'/>
        <text x='50' y='72' font-size='55' text-anchor='middle' font-family='Apple Color Emoji, Segoe UI Emoji, sans-serif'>${emoji}</text>
      </svg>
    `;
  }

  function openCaptcha(onSuccess) {
    // Pick 3-4 cats + fill rest with non-cats, then shuffle
    const cats = CAPTCHA_POOL.filter(x => x.type === 'cat');
    const others = CAPTCHA_POOL.filter(x => x.type !== 'cat');
    const numCats = 3 + Math.floor(Math.random() * 2); // 3 or 4
    const pickedCats = shuffleArr(cats).slice(0, numCats);
    const pickedOthers = shuffleArr(others).slice(0, 9 - numCats);
    captchaState.cells = shuffleArr([...pickedCats, ...pickedOthers]);
    captchaState.selected = new Set();
    captchaState.onSuccess = onSuccess;

    document.getElementById('captchaError').classList.remove('show');
    renderCaptchaGrid();
    document.getElementById('captchaOverlay').classList.add('active');
  }

  function renderCaptchaGrid() {
    const grid = document.getElementById('captchaGrid');
    grid.innerHTML = captchaState.cells.map((cell, i) => {
      const selected = captchaState.selected.has(i);
      return `<div class="captcha-cell ${selected ? 'selected' : ''}" onclick="toggleCaptchaCell(${i})">${cell.svg}</div>`;
    }).join('');
  }

  function toggleCaptchaCell(idx) {
    if (captchaState.selected.has(idx)) captchaState.selected.delete(idx);
    else captchaState.selected.add(idx);
    document.getElementById('captchaError').classList.remove('show');
    renderCaptchaGrid();
  }

  function verifyCaptcha() {
    // Correct: every selected cell is a cat AND every cat cell is selected
    let correct = true;
    captchaState.cells.forEach((cell, i) => {
      const isSelected = captchaState.selected.has(i);
      const isCat = cell.type === 'cat';
      if (isSelected !== isCat) correct = false;
    });

    if (!correct) {
      const err = document.getElementById('captchaError');
      err.classList.add('show');
      // re-shuffle so user can't brute force trivially
      captchaState.selected = new Set();
      const cats = CAPTCHA_POOL.filter(x => x.type === 'cat');
      const others = CAPTCHA_POOL.filter(x => x.type !== 'cat');
      const numCats = 3 + Math.floor(Math.random() * 2);
      const pickedCats = shuffleArr(cats).slice(0, numCats);
      const pickedOthers = shuffleArr(others).slice(0, 9 - numCats);
      captchaState.cells = shuffleArr([...pickedCats, ...pickedOthers]);
      renderCaptchaGrid();
      return;
    }

    // Success
    const cb = captchaState.onSuccess;
    closeCaptcha();
    showToast('✅ 驗證通過！');
    if (cb) cb();
  }

  function closeCaptcha() {
    document.getElementById('captchaOverlay').classList.remove('active');
    captchaState.onSuccess = null;
  }

  function shuffleArr(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Click outside to close
  document.getElementById('captchaOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'captchaOverlay') closeCaptcha();
  });

  // ====== Login ======
  function login() {
    const id = document.getElementById('loginId').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!id || !password) {
      showModal('🐾', '請輸入帳密', 'ID 和密碼都要填喔！', [{ text: '好的', primary: true }]);
      return;
    }
    const user = getUsers().find(u => u.id === id && u.password === password);
    if (!user) {
      showModal('😿', '登入失敗', '找不到這個帳號，或密碼錯誤！', [{ text: '再試一次', primary: true }]);
      return;
    }
    setSession(user.id);
    showToast('🐶 歡迎回來，' + user.name + '！');
    navigateTo('profile');
  }

  // ====== Logout ======
  function logout() {
    setSession(null);
    showToast('👋 已登出');
    navigateTo('share');
  }

  // ====== Profile ======
  function renderProfile() {
    const me = currentUser();
    const targetId = viewingProfileId || (me ? me.id : null);
    if (!targetId) { navigateTo('login'); return; }

    const targetUser = getUsers().find(u => u.id === targetId);
    if (!targetUser) {
      showModal('😿', '找不到使用者', '這位毛友可能不存在了～', [{ text: '好的', primary: true, action: () => navigateTo('share') }]);
      return;
    }

    const isOwn = me && me.id === targetUser.id;

    document.getElementById('profileAvatar').innerHTML = `<img src="${targetUser.avatar}" alt="avatar" />`;
    document.getElementById('profileName').textContent = targetUser.name;
    document.getElementById('profileId').textContent = targetUser.id;

    // Badge
    document.getElementById('profileBadge').innerHTML = isOwn
      ? `<span class="profile-badge">🏡 這是你的個人首頁</span>`
      : `<span class="profile-badge">🐾 你正在查看 @${escapeHtml(targetUser.id)} 的頁面</span>`;

    // Stats: number of posts, total likes received, total comments received
    const allPosts = getPosts();
    const theirPosts = allPosts.filter(p => p.userId === targetUser.id);
    const totalLikes = theirPosts.reduce((s, p) => s + (p.likes ? p.likes.length : 0), 0);
    const totalComments = theirPosts.reduce((s, p) => s + (p.comments ? p.comments.length : 0), 0);

    document.getElementById('profileStats').innerHTML = `
      <div class="profile-stat"><span class="num">${theirPosts.length}</span><span class="lbl">貼文</span></div>
      <div class="profile-stat"><span class="num">${totalLikes}</span><span class="lbl">獲讚</span></div>
      <div class="profile-stat"><span class="num">${totalComments}</span><span class="lbl">留言</span></div>
    `;

    // Show/hide own-user controls
    document.getElementById('newPostBtn').style.display = isOwn ? 'block' : 'none';
    document.getElementById('profileBackBtn').style.display = isOwn ? 'none' : 'inline-block';
    document.getElementById('profileSectionTitle').textContent = isOwn
      ? '📔 我的貼文紀錄'
      : `📔 @${targetUser.id} 的貼文`;

    const sorted = theirPosts.slice().sort((a, b) => b.createdAt - a.createdAt);
    const container = document.getElementById('myPostsList');

    if (sorted.length === 0) {
      container.innerHTML = `<div class="empty-state"><span class="emoji">🐾</span>${isOwn ? '還沒有貼文，快來發布第一篇吧！' : '這位毛友還沒有任何貼文～'}</div>`;
    } else {
      container.innerHTML = sorted.map(p => renderPostHTML(p)).join('');
    }
  }

  // ====== Prepare New Post Page ======
  function prepareNewPost() {
    const user = currentUser();
    if (!user) { navigateTo('login'); return; }
    document.getElementById('newpostAvatar').src = user.avatar;
    document.getElementById('newpostUserId').textContent = '@' + user.id;
    document.getElementById('postTitle').value = '';
    document.getElementById('postContent').value = '';
    document.getElementById('postImage').value = '';
    document.getElementById('postImagePreview').classList.remove('show');
    document.getElementById('postImagePreview').src = '';
  }

  // ====== Publish post ======
  function publishPost() {
    const user = currentUser();
    if (!user) { navigateTo('login'); return; }
    const title = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    const imgFile = document.getElementById('postImage').files[0];

    if (!title || !content) {
      showModal('🐾', '欄位未填', '請填寫主題和內容喔！', [{ text: '好的', primary: true }]);
      return;
    }

    const savePost = (imageData) => {
      const posts = getPosts();
      posts.unshift({
        id: 'post_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        userId: user.id,
        title,
        content,
        image: imageData,
        likes: [],
        comments: [],
        createdAt: Date.now()
      });
      savePosts(posts);
      showToast('🚀 貼文已發布！');
      navigateTo('profile');
    };

    if (imgFile) {
      const reader = new FileReader();
      reader.onload = (e) => savePost(e.target.result);
      reader.readAsDataURL(imgFile);
    } else {
      savePost(null);
    }
  }

  // ====== Render share area ======
  function renderShare() {
    const posts = getPosts().slice().sort((a,b)=>b.createdAt-a.createdAt);
    const container = document.getElementById('sharePostsList');
    if (posts.length === 0) {
      container.innerHTML = `<div class="empty-state"><span class="emoji">🐱</span>還沒有人發布貼文，趕快加入分享吧！</div>`;
      return;
    }
    container.innerHTML = posts.map(p => renderPostHTML(p)).join('');
  }

  // ====== Render single post HTML ======
  function renderPostHTML(post) {
    const users = getUsers();
    const author = users.find(u => u.id === post.userId);
    const authorAvatar = author ? author.avatar : defaultAvatar();
    const authorName = author ? author.name : '未知使用者';

    const user = currentUser();
    const liked = user && post.likes.includes(user.id);

    const timeStr = formatTime(post.createdAt);

    const isMine = user && user.id === post.userId;

    return `
      <div class="post" id="post-${post.id}">
        <div class="post-header">
          <img src="${authorAvatar}" alt="avatar" class="clickable-user" onclick="viewUserProfile('${post.userId}')" title="查看 @${escapeHtml(post.userId)} 的個人頁面" />
          <div class="user-info clickable-user" onclick="viewUserProfile('${post.userId}')" title="查看 @${escapeHtml(post.userId)} 的個人頁面">
            <div class="user-id">@${escapeHtml(post.userId)} <span style="color:#8a6b8a;font-weight:normal;">· ${escapeHtml(authorName)}</span></div>
            <div class="post-time">${timeStr}</div>
          </div>
          ${isMine ? `<button class="post-delete-btn" onclick="confirmDeletePost('${post.id}')" title="刪除貼文">🗑️</button>` : ''}
        </div>
        <div class="post-title">${escapeHtml(post.title)}</div>
        <div class="post-content">${escapeHtml(post.content)}</div>
        ${post.image ? `<img src="${post.image}" class="post-image" alt="post" />` : ''}
        <div class="post-actions">
          <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
            ${liked ? '❤️' : '🤍'} <span>${post.likes.length}</span>
          </button>
          <button class="action-btn" onclick="toggleComments('${post.id}')">
            💬 <span>${post.comments.length}</span>
          </button>
        </div>
        <div class="comments-section" id="comments-${post.id}">
          ${renderCommentsHTML(post)}
          ${renderCommentInputHTML(post.id)}
        </div>
      </div>
    `;
  }

  function renderCommentsHTML(post) {
    if (!post.comments || post.comments.length === 0) {
      return `<div class="no-comments">還沒有留言，快來搶頭香！🐾</div>`;
    }
    const users = getUsers();
    return post.comments.map(c => {
      const u = users.find(x => x.id === c.userId);
      const av = u ? u.avatar : defaultAvatar();
      const nm = u ? u.name : '未知';
      return `
        <div class="comment">
          <img src="${av}" alt="avatar" class="clickable-user" onclick="viewUserProfile('${c.userId}')" title="查看 @${escapeHtml(c.userId)} 的個人頁面" />
          <div class="comment-body">
            <div class="comment-user clickable-user" onclick="viewUserProfile('${c.userId}')" title="查看 @${escapeHtml(c.userId)} 的個人頁面">@${escapeHtml(c.userId)} <span style="color:#8a6b8a;font-weight:normal;font-size:12px;">· ${escapeHtml(nm)}</span></div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderCommentInputHTML(postId) {
    const user = currentUser();
    if (user) {
      return `
        <div class="comment-input-row">
          <input type="text" id="comment-input-${postId}" placeholder="留下你的留言..." onkeydown="if(event.key==='Enter') submitComment('${postId}')" />
          <button onclick="submitComment('${postId}')">送出</button>
        </div>
      `;
    } else {
      return `
        <div style="text-align:center; padding:10px; color:#8a6b8a; font-size:13px;">
          🔒 登入後即可留言！
          <button class="action-btn" style="margin-top:8px; display:inline-flex;" onclick="promptLoginForComment()">前往登入</button>
        </div>
      `;
    }
  }

  // ====== Delete Post ======
  function confirmDeletePost(postId) {
    const user = currentUser();
    if (!user) return;
    const posts = getPosts();
    const post = posts.find(p => p.id === postId);
    if (!post) return;
    if (post.userId !== user.id) {
      showModal('🚫', '無法刪除', '只能刪除自己發布的貼文喔！', [{ text: '好的', primary: true }]);
      return;
    }

    showModal('🗑️', '確定要刪除嗎？', `貼文「${post.title}」將會永遠消失，留言和按讚也會一起被刪除喔～`, [
      { text: '取消' },
      { text: '確定刪除', primary: true, action: () => deletePost(postId) }
    ]);
  }

  function deletePost(postId) {
    const user = currentUser();
    if (!user) return;
    let posts = getPosts();
    const post = posts.find(p => p.id === postId);
    if (!post || post.userId !== user.id) return;
    posts = posts.filter(p => p.id !== postId);
    savePosts(posts);
    showToast('🗑️ 貼文已刪除');
    refreshCurrentPage();
  }

  // ====== Like ======
  function toggleLike(postId) {
    const user = currentUser();
    if (!user) {
      showModal('🐾', '是否有平台帳號？', '請先登入或註冊才能按讚喔～', [
        { text: '取消' },
        { text: '前往登入', primary: true, action: () => navigateTo('login') }
      ]);
      return;
    }
    const posts = getPosts();
    const post = posts.find(p => p.id === postId);
    if (!post) return;
    const idx = post.likes.indexOf(user.id);
    if (idx >= 0) post.likes.splice(idx, 1);
    else post.likes.push(user.id);
    savePosts(posts);
    refreshCurrentPage();
  }

  // ====== Comments toggle ======
  function toggleComments(postId) {
    // If not logged in, show prompt asking if they have an account
    const user = currentUser();
    if (!user) {
      showModal('🐾', '是否有平台帳號？', '未登入只能查看貼文，要登入／註冊才能留言喔！您要繼續看留言還是去登入呢？', [
        { text: '只看留言', action: () => {
            const el = document.getElementById('comments-' + postId);
            if (el) el.classList.toggle('active');
          }
        },
        { text: '前往登入', primary: true, action: () => navigateTo('login') }
      ]);
      return;
    }
    const el = document.getElementById('comments-' + postId);
    if (el) el.classList.toggle('active');
  }

  function promptLoginForComment() {
    showModal('🐾', '是否有平台帳號？', '請先登入或註冊才能留言！', [
      { text: '註冊', action: () => navigateTo('register') },
      { text: '前往登入', primary: true, action: () => navigateTo('login') }
    ]);
  }

  // ====== Submit comment ======
  function submitComment(postId) {
    const user = currentUser();
    if (!user) { promptLoginForComment(); return; }
    const input = document.getElementById('comment-input-' + postId);
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const posts = getPosts();
    const post = posts.find(p => p.id === postId);
    if (!post) return;
    post.comments.push({
      userId: user.id,
      text,
      createdAt: Date.now()
    });
    savePosts(posts);
    // After re-render, keep comments open
    refreshCurrentPage();
    const reopened = document.getElementById('comments-' + postId);
    if (reopened) reopened.classList.add('active');
  }

  // ====== Refresh ======
  function refreshCurrentPage() {
    const active = document.querySelector('.page.active');
    if (!active) return;
    const id = active.id.replace('page-', '');
    if (id === 'profile') renderProfile();
    if (id === 'share') renderShare();
  }

  // ====== Modal ======
  function showModal(emoji, title, message, buttons) {
    document.getElementById('modalEmoji').textContent = emoji;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    const btnRow = document.getElementById('modalButtons');
    btnRow.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = b.primary ? 'btn-confirm' : 'btn-cancel';
      btn.textContent = b.text;
      btn.onclick = () => {
        hideModal();
        if (b.action) b.action();
      };
      btnRow.appendChild(btn);
    });
    document.getElementById('modalOverlay').classList.add('active');
  }
  function hideModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') hideModal();
  });

  // ====== Toast ======
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ====== Utils ======
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function formatTime(ts) {
    const d = new Date(ts);
    const now = Date.now();
    const diff = (now - ts) / 1000;
    if (diff < 60) return '剛剛';
    if (diff < 3600) return Math.floor(diff/60) + ' 分鐘前';
    if (diff < 86400) return Math.floor(diff/3600) + ' 小時前';
    if (diff < 604800) return Math.floor(diff/86400) + ' 天前';
    return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
  }

  // ====== Init ======
  function init() {
    // Seed demo data on very first load
    if (getUsers().length === 0) {
      const demo = [
        { id: 'doglover', name: '小白媽咪', password: '1234', avatar: makeEmojiAvatar('🐶', '#ffe0ec') },
        { id: 'catnip', name: '貓奴本人', password: '1234', avatar: makeEmojiAvatar('🐱', '#fff5d6') }
      ];
      saveUsers(demo);
      const samplePosts = [
        {
          id: 'demo_1',
          userId: 'doglover',
          title: '今天散步遇到一隻黃金獵犬！',
          content: '超大隻又超溫柔～小白還跟他玩了半小時呢！毛孩們的友誼真的好可愛 🥹',
          image: null,
          likes: ['catnip'],
          comments: [
            { userId: 'catnip', text: '哇～可以下次帶我們家也一起去嗎？', createdAt: Date.now() - 1000 * 60 * 30 }
          ],
          createdAt: Date.now() - 1000 * 60 * 60 * 2
        },
        {
          id: 'demo_2',
          userId: 'catnip',
          title: '我家主子又開始霸佔鍵盤了 😹',
          content: '完全沒辦法工作，但是太可愛了所以無法生氣...',
          image: null,
          likes: ['doglover'],
          comments: [],
          createdAt: Date.now() - 1000 * 60 * 60 * 5
        }
      ];
      savePosts(samplePosts);
    }
    navigateTo('share');
  }

  function makeEmojiAvatar(emoji, bg) {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='${encodeURIComponent(bg)}'/><text x='50' y='68' font-size='55' text-anchor='middle'>${emoji}</text></svg>`;
    return 'data:image/svg+xml;utf8,' + svg;
  }

  init();
</script>
</body>
